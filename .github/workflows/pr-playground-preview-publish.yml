name: PR Playground Preview Publish

# Publishes the read-only build artifact from "PR Playground Preview Build" and
# writes the Playground button to the PR. This workflow must not check out or
# execute pull request code, and must treat everything the build run produced
# as untrusted.

on:
  workflow_run:
    workflows:
      - PR Playground Preview Build
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  playground-preview:
    name: Publish Playground preview button
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Resolve pull request from the triggering run
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The build runs untrusted PR code, so nothing it uploads can identify
          # the PR; only the triggering run's own metadata can.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # workflow_run.pull_requests is empty for fork PRs; match repo, branch and SHA so no other PR at this commit can claim the run.
          pr_numbers="$(
            gh api "repos/${GH_REPO}/pulls?state=open&per_page=100" --paginate \
              --jq '.[] | select(.head.sha == env.HEAD_SHA and .head.repo.full_name == env.HEAD_REPO and .head.ref == env.HEAD_BRANCH) | .number'
          )"
          # First match; piping into head instead would SIGPIPE gh under pipefail.
          pr_number="${pr_numbers%%$'\n'*}"

          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve an open pull request for ${HEAD_REPO}@${HEAD_BRANCH} (${HEAD_SHA})." >&2
            exit 1
          fi

          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Download and verify plugin zip artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name plugin-check-zip \
            --dir plugin-zip

          # Untrusted artifact: publish only a regular file that is a valid zip.
          zip_path=plugin-zip/plugin-check.zip
          if [[ -L "$zip_path" || ! -f "$zip_path" ]]; then
            echo "Refusing to publish: '$zip_path' is not a regular file." >&2
            exit 1
          fi
          unzip -tq "$zip_path"

      # The expose action does not check artifacts from other runs, so hand it this run's verified copy.
      - name: Upload verified plugin zip for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-check-zip
          path: plugin-zip/plugin-check.zip
          if-no-files-found: error
          retention-days: 1

      # Pinned to commits: this job holds a write token, and a moved tag on
      # either action would run new code with it.
      - name: Expose built artifact as a public URL
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@43fc435558bc6cee69f5b214d6b8ca4f9f80c31d # v3
        with:
          artifact-name:     plugin-check-zip
          artifact-filename: plugin-check.zip
          pr-number:         ${{ steps.metadata.outputs.pr-number }}
          commit-sha:        ${{ github.event.workflow_run.head_sha }}
          artifacts-to-keep: '2'
          github-token:      ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Playground blueprint
        id: blueprint
        env:
          ARTIFACT_URL: ${{ steps.expose.outputs.artifact-url }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const url = process.env.ARTIFACT_URL;
          if (!url) {
            throw new Error('ARTIFACT_URL is required');
          }
          const blueprint = {
            "$schema": "https://playground.wordpress.net/blueprint-schema.json",
            landingPage: "/wp-admin/tools.php?page=plugin-check",
            phpExtensionBundles: [ "kitchen-sink" ],
            steps: [
              {
                step: "login",
                username: "admin",
                password: "password",
              },
              {
                step: "installPlugin",
                pluginZipFile: {
                  resource: "url",
                  url,
                },
                options: { activate: true },
              },
            ],
          };
          console.log(`blueprint=${JSON.stringify(blueprint)}`);
          NODE

      - name: Post Playground Preview Button
        uses: WordPress/action-wp-playground-pr-preview@43fc435558bc6cee69f5b214d6b8ca4f9f80c31d # v3
        with:
          mode:         append-to-description
          blueprint:    ${{ steps.blueprint.outputs.blueprint }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number:    ${{ steps.metadata.outputs.pr-number }}
